name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov --cov-report=term
      - name: Demo smoke test
        run: physim-gate demo --output-dir "${{ runner.temp }}/demo"

  minimum-versions:
    # Install the lowest versions allowed by pyproject.toml so the declared floors stay true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv pip install --system --resolution lowest-direct -e . "pytest>=8"
      - run: python -m pip list
      # Old typer with current click emits deprecation warnings, and the published JSON Schema
      # snapshot is generated with the latest pydantic, so both are excluded here.
      - run: >-
          python -m pytest -W ignore::DeprecationWarning
          --deselect tests/test_schema.py::test_published_json_schema_is_current

  extras:
    # Optional integrations: Gymnasium (CPU only) and the example third-party adapter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,gymnasium]" -e examples/csv-adapter
      - run: python -m pytest tests/test_gymnasium.py tests/test_example_plugin.py
      - name: Gymnasium example (expected to report a regression, exit code 1)
        run: |
          set +e
          PYTHONPATH=examples/gymnasium physim-gate compare --adapter gymnasium \
            -b examples/gymnasium/baseline.yaml -c examples/gymnasium/candidate.yaml \
            -g examples/gymnasium/gate.yaml
          test $? -eq 1

  action:
    # The composite action in action.yml, run the way users run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate a regression without failing the step
        id: regression
        uses: ./
        with:
          baseline: examples/highway-merge/baseline.json
          candidate: examples/highway-merge/candidate.json
          config: examples/highway-merge/gate.yaml
          output-dir: ${{ runner.temp }}/highway
          fail: "false"
      - name: Gate real LeRobot output through the lerobot adapter
        id: lerobot
        uses: ./
        with:
          adapter: lerobot
          adapter-options: |
            start_seed=1000
          baseline: examples/lerobot-pusht/baseline
          candidate: examples/lerobot-pusht/baseline-rerun
          config: examples/lerobot-pusht/gate.yaml
          output-dir: ${{ runner.temp }}/lerobot
          setup-python: "false"
      - name: Check the outputs
        env:
          REGRESSION_VERDICT: ${{ steps.regression.outputs.verdict }}
          REGRESSION_CODE: ${{ steps.regression.outputs.exit-code }}
          LEROBOT_VERDICT: ${{ steps.lerobot.outputs.verdict }}
          LEROBOT_DIR: ${{ steps.lerobot.outputs.report-dir }}
        run: |
          test "$REGRESSION_VERDICT" = FAIL
          test "$REGRESSION_CODE" = 1
          test "$LEROBOT_VERDICT" = PASS
          for f in comparison.json junit.xml report.html summary.md; do test -s "$LEROBOT_DIR/$f"; done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel into a clean environment and run the demo
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/physim-gate demo --output-dir /tmp/demo
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
