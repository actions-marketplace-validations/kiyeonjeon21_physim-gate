[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "physim-gate-csv"
version = "0.1.0"
description = "Example third-party PhySim Gate adapter: one CSV row per trial."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["physim-gate>=0.1,<0.5"]

# This is the whole integration: register the adapter under the entry-point group.
[project.entry-points."physim_gate.adapters"]
csv = "physim_gate_csv:CsvAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/physim_gate_csv"]
