# Gate for LeRobot PushT evaluations (see README.md in this directory).
version: 1
defaults:
  confidence: 0.95
  min_samples: 30
  pairing: auto
policy:
  on_inconclusive: fail
  on_invalid: fail
metrics:
  success:
    # Success rate may drop by at most 5 percentage points.
    max_absolute_degradation: 0.05
  max_reward:
    # PushT reward is the goal-region coverage (0-1); 1.0 means the T is in place.
    max_absolute_degradation: 0.05
  sum_reward:
    max_relative_degradation: 0.10
    required: false
