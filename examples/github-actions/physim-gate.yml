# Example: gate a pull request on simulation regressions.
#
# Copy to .github/workflows/ in your own repository and adapt the "simulate" step.
# PhySim Gate never runs your simulator. It compares the result files your job produces.
name: simulation regression gate

on:
  pull_request:

permissions:
  contents: read
  checks: write   # only needed by the optional JUnit annotation step

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PhySim Gate
        # Not on PyPI yet: install from a pinned git revision of the repository.
        run: python -m pip install "physim-gate @ git+https://github.com/kiyeonjeon21/physim-gate@v0.1.0"

      - name: Simulate the candidate
        # Replace with your own simulation job. It must write a run result
        # (PhySim Gate JSON, or any format an installed adapter understands).
        run: ./scripts/run_simulation_suite.sh --out results/candidate.json

      - name: Fetch the baseline
        # For example a result file committed on the main branch, or an artifact from the
        # last main-branch run. Pin it so the comparison is reproducible.
        run: mkdir -p results && cp baselines/highway_merge.json results/baseline.json

      - name: Compare
        id: gate
        run: |
          physim-gate compare \
            --baseline results/baseline.json \
            --candidate results/candidate.json \
            --config gate.yaml \
            --output results/comparison.json \
            --junit results/junit.xml \
            --html results/report.html

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: physim-gate-report
          path: results/

      # Optional: show per-metric results in the PR checks UI.
      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: results/junit.xml
          check_name: physim-gate

# Exit codes of "physim-gate compare":
#   0 pass, 1 regression, 2 usage or input error, 3 inconclusive or invalid, 4 internal error.
# To let inconclusive results through while still failing on regressions, set
# policy.on_inconclusive: pass in gate.yaml rather than ignoring exit code 3 here.
