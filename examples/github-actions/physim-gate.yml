# Example: gate a pull request on simulation regressions.
#
# Copy to .github/workflows/ in your own repository and adapt the "simulate" step.
# PhySim Gate never runs your simulator. It compares the result files your job produces.
name: simulation regression gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # only needed for "comment: true"
  checks: write          # only needed by the optional JUnit annotation step

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Simulate the candidate
        # Replace with your own simulation job. It must write a run result
        # (PhySim Gate JSON, or any format an adapter understands, such as LeRobot's
        # eval_info.json with "adapter: lerobot").
        run: ./scripts/run_simulation_suite.sh --out results/candidate.json

      - name: Fetch the baseline
        # For example a result file committed on the main branch, or an artifact from the
        # last main-branch run. Pin it so the comparison is reproducible.
        run: mkdir -p results && cp baselines/highway_merge.json results/baseline.json

      - name: Gate
        id: gate
        # Installs physim-gate from the same tag, sets up Python, writes the Markdown summary
        # to the job summary and fails the step unless the gate passes.
        uses: kiyeonjeon21/physim-gate@v0.3.0
        with:
          baseline: results/baseline.json
          candidate: results/candidate.json
          config: gate.yaml
          output-dir: results/gate
          comment: "true"   # post the summary on the pull request and update it on each push

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: physim-gate-report
          path: results/

      # Optional: show per-metric results in the PR checks UI.
      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: results/gate/junit.xml
          check_name: physim-gate

# The action's outputs are steps.gate.outputs.verdict (PASS, FAIL, INCONCLUSIVE or INVALID)
# and steps.gate.outputs.exit-code. With "fail: false" the step never fails on a verdict, only
# on usage or internal errors, so later steps can decide.
#
# Other CI systems: pip install physim-gate, then run
#   physim-gate compare -b baseline.json -c candidate.json -g gate.yaml --markdown summary.md
# Exit codes: 0 pass, 1 regression, 2 usage or input error, 3 inconclusive or invalid,
# 4 internal error. To let inconclusive results through while still failing on regressions,
# set policy.on_inconclusive: pass in gate.yaml rather than ignoring exit code 3.
